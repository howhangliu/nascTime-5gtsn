[General]
network = simu5g.simulations.nr.nascTime_tests.multi_endpoint_test.MultiEndpointNetwork
sim-time-limit = 10s
warmup-period = 1s
simtime-resolution = fs

scheduler-class = "omnetpp::cSequentialScheduler"

result-dir = results/multi_endpoint
**.routingRecorder.enabled = false
**.vector-recording = false
**.scalar-recording = true
**.receivedPacketFromLowerLayer.result-recording-modes = -
**.packetReceived.result-recording-modes = -

# ============================================================================
# TSN AF
# ============================================================================
*.tsnAf.portSpeedBps = 1Gbps
*.tsnAf.numTrafficClasses = 8
*.tsnAf.nwTtModule = "nwTt"
*.tsnAf.dsTtModule = "dsTt[0]"
*.tsnAf.gnbModule = "gnb"

# ============================================================================
# Static BMCA — multi-endpoint spanning tree
# ============================================================================
*.staticBmca.grandmasterModule = "tsnDeviceA"
*.staticBmca.transparentClockEnabled = true
*.staticBmca.correctionFieldSupport = true
*.staticBmca.spanningTree = [ \
    {node: "tsnDeviceA", role: "MASTER", masterPorts: ["eth0"], slavePort: ""}, \
    {node: "tsnSwitch", role: "BRIDGE", masterPorts: ["eth1"], slavePort: "eth0"}, \
    {node: "tsnDeviceB[0]", role: "SLAVE", masterPorts: [], slavePort: "eth0"}, \
    {node: "tsnDeviceB[1]", role: "SLAVE", masterPorts: [], slavePort: "eth0"}, \
    {node: "tsnDeviceB[2]", role: "SLAVE", masterPorts: [], slavePort: "eth0"}]

# ============================================================================
# IP / ARP
# ============================================================================
*.configurator.assignAddresses = true
*.configurator.addStaticRoutes = true
*.configurator.addDefaultRoutes = false
**.arp.typename = "GlobalArp"
*.binderModule = "binder"

# ============================================================================
# 5G RAN
# ============================================================================
*.carrierAggregation.numComponentCarriers = 1
*.carrierAggregation.componentCarrier[0].carrierFrequency = 3.5GHz
*.carrierAggregation.componentCarrier[0].numBands = 25
*.carrierAggregation.componentCarrier[0].numerologyIndex = 1

*.gnb.cellularNic.typename = "NRNicEnbDrb"
*.gnb.cellularNic.phy.channelModel[0].typename = "NrChannelModel"
*.gnb.cellularNic.phy.channelModel[0].scenario = "INDOOR_HOTSPOT"
*.gnb.cellularNic.phy.channelModel[0].shadowing = false
*.gnb.cellularNic.phy.channelModel[0].fading = false
*.gnb.cellularNic.phy.channelModel[0].dynamicLos = false
*.gnb.mobility.initialX = 500m
*.gnb.mobility.initialY = 250m

# ============================================================================
# UEs (all NRUeDsTt with Ethernet ports)
# ============================================================================
*.ue[*].masterId = 0
*.ue[*].nrMacCellId = 1
*.ue[*].nrMasterId = 1
*.ue[*].ipv4.forwarding = true

*.ue[0].mobility.initialX = 960m
*.ue[0].mobility.initialY = 250m
*.ue[1].mobility.initialX = 960m
*.ue[1].mobility.initialY = 350m
*.ue[2].mobility.initialX = 960m
*.ue[2].mobility.initialY = 450m

# the following can not override the fixed parmaters to enable multiple sessions.
# left them here as a reminder to set those in the cellularNic (NRNicEnbDrb) as true. 
*.gnb.cellularNic.nrPdcp[*].multiSession = true
*.gnb.cellularNic.nrRlc[*].um.multiSession = true

*.gnb.cellularNic.numDrbs = 2
*.ue[*].cellularNic.numDrbs = 2
# ============================================================================
# NW-TT (multi-endpoint registration)
# ============================================================================
*.nwTt.translator.ueAddress = "ue[0]"
*.nwTt.translator.localAddress = "nwTt"
*.nwTt.translator.tsnDeviceBAddress = ""
*.nwTt.translator.tsnDeviceBAddresses = [ \
    {address: "tsnDeviceB[0]", ue: "ue[0]"}, \
    {address: "tsnDeviceB[1]", ue: "ue[1]"}, \
    {address: "tsnDeviceB[2]", ue: "ue[2]"}]
*.nwTt.translator.gptpTransportMode = "gtpu"
*.nwTt.translator.gptpEncapUdpPort = 30001
*.nwTt.ethIf.bitrate = 1Gbps

# ============================================================================
# DS-TTs
# ============================================================================
*.dsTt[*].ueEth.mac.promiscuous = true
*.dsTt[*].tsnEth.mac.promiscuous = true
*.dsTt[*].translator.gptpEncapUdpPort = 30001

# ============================================================================
# Ethernet
# ============================================================================
*.tsnDeviceA.eth[*].bitrate = 1Gbps
*.tsnSwitch.eth[*].bitrate = 1Gbps
*.tsnSwitch.eth[1].typename = "EthernetInterface"
*.tsnDeviceB[*].eth[*].typename = "EthernetInterface"

# ============================================================================
# gPTP (on Device A and switch only — Device B disabled for now)
# ============================================================================
*.tsnDeviceA.hasTimeSynchronization = true
*.tsnDeviceA.gptp.gptpNodeType = "MASTER_NODE"
*.tsnDeviceA.gptp.masterPorts = ["eth0"]
*.tsnDeviceA.gptp.slavePort = ""
*.tsnDeviceA.clock.typename = "OscillatorBasedClock"
*.tsnDeviceA.clock.oscillator.nominalTickLength = 10ns

*.tsnSwitch.hasTimeSynchronization = false
*.tsnSwitch.gptp.gptpNodeType = "BRIDGE_NODE"
*.tsnSwitch.gptp.masterPorts = ["eth1"]
*.tsnSwitch.gptp.slavePort = "eth0"
*.tsnSwitch.clock.oscillator.nominalTickLength = 10ns

*.tsnDeviceB[*].hasTimeSynchronization = true
*.tsnDeviceB[*].gptp.gptpNodeType = "SLAVE_NODE"
*.tsnDeviceB[*].gptp.slavePort = "eth0"
*.tsnDeviceB[*].gptp.masterPorts = []
*.tsnDeviceB[*].gptp.pdelayInterval = 1000s
*.tsnDeviceB[*].gptp.pdelayInitialOffset = 1000s
*.tsnDeviceB[*].clock.typename = "SettableClock"
*.tsnDeviceB[*].clock.oscillator.nominalTickLength = 10ns

# ============================================================================
# SDAP / DRB Configuration
# ============================================================================
# gNB: per-UE DRB mapping (NR nodeIds: 2049, 2050, 2051)
*.gnb.cellularNic.sdap.drbConfig = [ \
    {drb: 0, ue: 2049, qfiList: [0]}, {drb: 1, ue: 2049, qfiList: [6]}, \
    {drb: 0, ue: 2050, qfiList: [0]}, {drb: 1, ue: 2050, qfiList: [6]}, \
    {drb: 0, ue: 2051, qfiList: [0]}, {drb: 1, ue: 2051, qfiList: [6]}]

# UE: self DRB mapping (no "ue" field)
*.ue[*].cellularNic.sdap.drbConfig = [{drb: 0, qfiList: [0]}, {drb: 1, qfiList: [6]}]

# ============================================================================
# TSN Device A: VLAN tagging with two traffic classes per endpoint
# ============================================================================
*.tsnDeviceA.hasOutgoingStreams = true

# 7 apps: 2 per endpoint (high priority + best effort) + 1 sink for reverse traffic
*.tsnDeviceA.numApps = 7

# Endpoint 0: high priority
*.tsnDeviceA.app[0].typename = "UdpBasicApp"
*.tsnDeviceA.app[0].destAddresses = "tsnDeviceB[0]"
*.tsnDeviceA.app[0].destPort = 5000
*.tsnDeviceA.app[0].localPort = 5000
*.tsnDeviceA.app[0].messageLength = 100B
*.tsnDeviceA.app[0].sendInterval = 1ms
*.tsnDeviceA.app[0].startTime = uniform(0s, 0.01s)

# Endpoint 0: best effort
*.tsnDeviceA.app[1].typename = "UdpBasicApp"
*.tsnDeviceA.app[1].destAddresses = "tsnDeviceB[0]"
*.tsnDeviceA.app[1].destPort = 5001
*.tsnDeviceA.app[1].localPort = 5001
*.tsnDeviceA.app[1].messageLength = 500B
*.tsnDeviceA.app[1].sendInterval = exponential(2ms)
*.tsnDeviceA.app[1].startTime = uniform(0s, 0.01s)

# Endpoint 1: high priority
*.tsnDeviceA.app[2].typename = "UdpBasicApp"
*.tsnDeviceA.app[2].destAddresses = "tsnDeviceB[1]"
*.tsnDeviceA.app[2].destPort = 5000
*.tsnDeviceA.app[2].localPort = 5002
*.tsnDeviceA.app[2].messageLength = 100B
*.tsnDeviceA.app[2].sendInterval = 1ms
*.tsnDeviceA.app[2].startTime = uniform(0s, 0.01s)

# Endpoint 1: best effort
*.tsnDeviceA.app[3].typename = "UdpBasicApp"
*.tsnDeviceA.app[3].destAddresses = "tsnDeviceB[1]"
*.tsnDeviceA.app[3].destPort = 5001
*.tsnDeviceA.app[3].localPort = 5003
*.tsnDeviceA.app[3].messageLength = 500B
*.tsnDeviceA.app[3].sendInterval = exponential(2ms)
*.tsnDeviceA.app[3].startTime = uniform(0s, 0.01s)

# Endpoint 2: high priority
*.tsnDeviceA.app[4].typename = "UdpBasicApp"
*.tsnDeviceA.app[4].destAddresses = "tsnDeviceB[2]"
*.tsnDeviceA.app[4].destPort = 5000
*.tsnDeviceA.app[4].localPort = 5004
*.tsnDeviceA.app[4].messageLength = 100B
*.tsnDeviceA.app[4].sendInterval = 1ms
*.tsnDeviceA.app[4].startTime = uniform(0s, 0.01s)

# Endpoint 2: best effort
*.tsnDeviceA.app[5].typename = "UdpBasicApp"
*.tsnDeviceA.app[5].destAddresses = "tsnDeviceB[2]"
*.tsnDeviceA.app[5].destPort = 5001
*.tsnDeviceA.app[5].localPort = 5005
*.tsnDeviceA.app[5].messageLength = 500B
*.tsnDeviceA.app[5].sendInterval = exponential(2ms)
*.tsnDeviceA.app[5].startTime = uniform(0s, 0.01s)

# Device A: sink for reverse traffic
*.tsnDeviceA.app[6].typename = "UdpSink"
*.tsnDeviceA.app[6].localPort = 7000

# Stream identification: map apps to streams with PCP
*.tsnDeviceA.bridging.streamIdentifier.identifier.mapping = [ \
    {packetFilter: "*-0", stream: "ep0_high"}, \
    {packetFilter: "*-1", stream: "ep0_low"}, \
    {packetFilter: "*-2", stream: "ep1_high"}, \
    {packetFilter: "*-3", stream: "ep1_low"}, \
    {packetFilter: "*-4", stream: "ep2_high"}, \
    {packetFilter: "*-5", stream: "ep2_low"}]
*.tsnDeviceA.bridging.streamCoder.encoder.mapping = [ \
    {stream: "ep0_high", vlan: 100, pcp: 6}, \
    {stream: "ep0_low", vlan: 200, pcp: 0}, \
    {stream: "ep1_high", vlan: 101, pcp: 6}, \
    {stream: "ep1_low", vlan: 201, pcp: 0}, \
    {stream: "ep2_high", vlan: 102, pcp: 6}, \
    {stream: "ep2_low", vlan: 202, pcp: 0}]

# Device B: 2 sinks per endpoint + 1 source of reverse traffic
*.tsnDeviceB[*].numApps = 3
*.tsnDeviceB[*].app[0].typename = "UdpSink"
*.tsnDeviceB[*].app[0].localPort = 5000
*.tsnDeviceB[*].app[1].typename = "UdpSink"
*.tsnDeviceB[*].app[1].localPort = 5001

# Reverse traffic: each Device B sends to Device A
*.tsnDeviceB[*].app[2].typename = "UdpBasicApp"
*.tsnDeviceB[*].app[2].destAddresses = "tsnDeviceA"
*.tsnDeviceB[*].app[2].destPort = 7000
*.tsnDeviceB[*].app[2].localPort = 7000
*.tsnDeviceB[*].app[2].messageLength = 100B
*.tsnDeviceB[*].app[2].sendInterval = 10ms
*.tsnDeviceB[*].app[2].startTime = 1s
# ============================================================================
# Scenario
# ============================================================================
[Config MultiEndpointTest]
description = "3 endpoints through the 5G-TSN bridge"
*.numEndpoints = 3
