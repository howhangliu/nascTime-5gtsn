include ../sumo_closed_loop_frer/omnetpp.ini

[Config AgvFleetUplinkFrer]
extends = SumoClosedLoopUplinkFrer
description = "Buildsheet AGV fleet: 3 safety shuttle, 2 NW, 2 SE, 3 static arms; dual-leg uplink FRER"
network = nasctime.simulations.demos.agv_fleet_frer.AgvFleetFrerNetwork
sim-time-limit = 620s
warmup-period = 20s

# Ten reproducible radio/SUMO seeds. random_free route positions therefore
# change between runs while the required UE count in every area stays fixed.
*.veinsManager.seed = ${fleetSeed=3400..3409}
seed-set = ${fleetSeed}
*.veinsManager.launchConfig = xmldoc("agv_fleet.launchd.xml")
*.veinsManager.margin = 1
# NrNicUeDC owns bearer modules created dynamically at runtime. Let OMNeT++
# finish/delete the vehicles with the rest of the network instead of having
# Veins delete them while their nested submodules are being enumerated.
*.veinsManager.deleteManagedModulesOnNetworkFinish = false

# Buildsheet radio geometry and carrier.
*.carrierAggregation.componentCarrier[0].carrierFrequency = 3.5GHz
*.carrierAggregation.componentCarrier[0].numBands = 25
*.carrierAggregation.componentCarrier[0].numerologyIndex = 1
# Simu5G's INDOOR_HOTSPOT NLOS equation throws for horizontal distances below
# 6 m. The documented gNB points coincide with loop waypoints A2/E2, so keep
# their GUI markers on the boundary but place the radio coordinates 6.1 m
# outward. This preserves the 100 m floor plan and avoids an undefined model
# domain when a vehicle passes the antenna marker.
*.gnb.mobility.initialX = -4.1m
*.gnb.mobility.initialY = 52m
*.gnb.mobility.initialZ = 8m
*.gnb2.mobility.initialX = 108.1m
*.gnb2.mobility.initialY = 52m
*.gnb2.mobility.initialZ = 8m
**.eNodeBTxPower = 23dBm
**.ueTxPower = 23dBm

# Names below match this workspace's Simu5G NED files (camelCase).
*.gnb.cellularNic.channelModel[0].nodebHeight = 8m
*.gnb2.cellularNic.channelModel[0].nodebHeight = 8m
*.gnb.cellularNic.channelModel[0].ueHeight = 1.5m
*.gnb2.cellularNic.channelModel[0].ueHeight = 1.5m
*.gnb.cellularNic.channelModel[0].antennaGainUe = 0dBi
*.gnb2.cellularNic.channelModel[0].antennaGainUe = 0dBi
**.channelModel[0].scenario = "INDOOR_HOTSPOT"
**.channelModel[0].shadowing = true
**.channelModel[0].fading = true
**.channelModel[0].fadingType = "JAKES"
**.channelModel[0].dynamicLos = true
**.channelModel[0].targetBler = 0.3
**.channelModel[0].uplinkInterference = true
**.channelModel[0].bgCellInterference = true
*.car[*].cellularNic.nrChannelModel2[0].scenario = "INDOOR_HOTSPOT"
*.car[*].cellularNic.nrChannelModel2[0].shadowing = true
*.car[*].cellularNic.nrChannelModel2[0].fading = true
*.car[*].cellularNic.nrChannelModel2[0].fadingType = "JAKES"
*.car[*].cellularNic.nrChannelModel2[0].dynamicLos = true
*.car[*].cellularNic.nrChannelModel2[0].targetBler = 0.3
*.car[*].cellularNic.nrChannelModel2[0].uplinkInterference = true
*.car[*].cellularNic.nrChannelModel2[0].bgCellInterference = true
**.mac.maxHarqRtx = 1
*.gnb.cellularNic.mac.schedulingDisciplineUl = "DRR"
*.gnb2.cellularNic.mac.schedulingDisciplineUl = "DRR"

# The baseline first validates SUMO mobility and FRER without synthetic
# interference. Enable the buildsheet's eight-UE interference arm with the
# AgvFleetUplinkFrerWithBackground configuration below.
*.numBgCells = 0
*.bgCell[0].mobility.initialX = 50m
*.bgCell[0].mobility.initialY = 50m
*.bgCell[0].bgScheduler.isNr = true
*.bgCell[0].bgScheduler.carrierFrequency = 3.5GHz
*.bgCell[0].bgScheduler.numBands = 25
*.bgCell[0].bgScheduler.numerologyIndex = 1
*.bgCell[0].bgScheduler.txPower = 23dBm
*.bgCell[0].bgTrafficGenerator.numBgUes = 8
*.bgCell[0].bgTrafficGenerator.bgUE[0].mobility.initialX = 137m
*.bgCell[0].bgTrafficGenerator.bgUE[0].mobility.initialY = 50m
*.bgCell[0].bgTrafficGenerator.bgUE[1].mobility.initialX = 111.52m
*.bgCell[0].bgTrafficGenerator.bgUE[1].mobility.initialY = 111.52m
*.bgCell[0].bgTrafficGenerator.bgUE[2].mobility.initialX = 50m
*.bgCell[0].bgTrafficGenerator.bgUE[2].mobility.initialY = 137m
*.bgCell[0].bgTrafficGenerator.bgUE[3].mobility.initialX = -11.52m
*.bgCell[0].bgTrafficGenerator.bgUE[3].mobility.initialY = 111.52m
*.bgCell[0].bgTrafficGenerator.bgUE[4].mobility.initialX = -37m
*.bgCell[0].bgTrafficGenerator.bgUE[4].mobility.initialY = 50m
*.bgCell[0].bgTrafficGenerator.bgUE[5].mobility.initialX = -11.52m
*.bgCell[0].bgTrafficGenerator.bgUE[5].mobility.initialY = -11.52m
*.bgCell[0].bgTrafficGenerator.bgUE[6].mobility.initialX = 50m
*.bgCell[0].bgTrafficGenerator.bgUE[6].mobility.initialY = -37m
*.bgCell[0].bgTrafficGenerator.bgUE[7].mobility.initialX = 111.52m
*.bgCell[0].bgTrafficGenerator.bgUE[7].mobility.initialY = -11.52m
*.bgCell[0].bgTrafficGenerator.bgUE[*].generator.typename = "TrafficGeneratorCbr"
*.bgCell[0].bgTrafficGenerator.bgUE[*].generator.startTimeUl = uniform(0s,50ms)
*.bgCell[0].bgTrafficGenerator.bgUE[*].generator.packetSizeUl = 100B
*.bgCell[0].bgTrafficGenerator.bgUE[*].generator.periodUl = 10ms

# One FRER-protected 100 B stream per UE; every stream has the same DSCP/QFI.
*.car[*].positionSource.app[0].messageLength = 100B
*.car[*].positionSource.app[0].dscp = 7
*.car[*].positionSource.app[0].startTime = 20s + uniform(0ms,9ms)
*.car[*].positionSource.app[0].stopTime = 619.9s
*.car[0..2].positionSource.app[0].sendInterval = 40ms
*.car[3..6].positionSource.app[0].sendInterval = 125ms
*.car[7..9].positionSource.app[0].sendInterval = 400ms

# Bring-up FRER arm from the buildsheet. Erasure injection is intentionally
# absent, as requested by section 05. Both cellular members remain FCFS.
*.nwTt.frerRecoveryUl.windowSize = 4
*.nwTt.frerRecoveryUl.windowTimeout = 250ms

result-dir = results/${fleetSeed}
output-scalar-file = ${resultdir}/${configname}.sca
output-vector-file = ${resultdir}/${configname}.vec

[Config AgvFleetUplinkFrerWithBackground]
extends = AgvFleetUplinkFrer
description = "AGV fleet FRER plus eight synthetic UL interferers at 87 m"
*.numBgCells = 1
result-dir = results/with-background/${fleetSeed}
