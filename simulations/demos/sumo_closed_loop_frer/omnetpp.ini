# Reuse the validated dual-connectivity FRER bearer/QoS configuration, then
# replace its static topology and endpoints with SUMO-managed vehicles.
include ../frer_test/frer_uplink_dualconn.ini

[Config SumoClosedLoopUplinkFrer]
extends = FrerUplinkDualConn_N1
description = "100m x 100m closed-loop uplink FRER, 10 SUMO vehicles, 20B/10ms position reports"
network = nasctime.simulations.demos.sumo_closed_loop_frer.SumoClosedLoopFrerNetwork
sim-time-limit = 30s
warmup-period = 1s
seed-set = 2309

# OMNeT++ uses the first matching parameter assignment. These overrides must
# appear before the included static profile, which contains tsnDeviceB[*]
# registrations that do not exist in this dynamic SUMO topology.
*.nwTt.translator.ueAddress = "nwTt"
*.nwTt.translator.localAddress = "nwTt"
*.nwTt.translator.tsnDeviceBAddress = ""
*.nwTt.translator.tsnDeviceBAddresses = []

# Supplies the primary/secondary gNB DRB entries for UE node IDs 2049..2058.
include ../frer_test/profiles/profiles_N10_scalability_frer_asym.ini

# ---------------------------------------------------------------------------
# SUMO / Veins
# ---------------------------------------------------------------------------
*.veinsManager.host = "localhost"
*.veinsManager.port = 9999
*.veinsManager.moduleType = "nasctime.simulations.demos.sumo_closed_loop_frer.SumoFrerVehicle"
*.veinsManager.moduleName = "car"
*.veinsManager.launchConfig = xmldoc("square.launchd.xml")
*.veinsManager.updateInterval = 10ms
*.veinsManager.margin = 0
*.veinsManager.seed = 2309
*.veinsManager.autoShutdown = false

*.car[*].mobility.typename = "VeinsInetMobility"
# DynamicVehicleNetworkConfigurator performs a display-only 5x transform.
# Prevent MobilityBase::refreshDisplay() from overwriting it with raw 0..100
# coordinates; mobility/radio state still comes directly from SUMO.
*.car[*].mobility.updateDisplayString = false

# ---------------------------------------------------------------------------
# 100 m x 100 m radio geometry: gNBs at diagonal corners
# ---------------------------------------------------------------------------
*.gnb.mobility.typename = "StationaryMobility"
*.gnb.mobility.initFromDisplayString = false
*.gnb.mobility.updateDisplayString = false
*.gnb.mobility.initialX = 5m
*.gnb.mobility.initialY = 5m
*.gnb.mobility.initialZ = 10m

*.gnb2.mobility.typename = "StationaryMobility"
*.gnb2.mobility.initFromDisplayString = false
*.gnb2.mobility.updateFromDisplayString = false
*.gnb2.mobility.updateDisplayString = false
*.gnb2.mobility.initialX = 95m
*.gnb2.mobility.initialY = 95m
*.gnb2.mobility.initialZ = 10m

*.gnb.macNodeId = 1
*.gnb.macCellId = 1
*.gnb2.macNodeId = 2
*.gnb2.macCellId = 2
*.gnb2.masterId = 1
*.gnb2.gateway = "upf2"
*.upf2.gtp_user.forceTunnelPeer = "gnb2"

*.gnb.cellularNic.channelModel[0].scenario = "INDOOR_HOTSPOT"
*.gnb2.cellularNic.channelModel[0].scenario = "INDOOR_HOTSPOT"
*.gnb.cellularNic.channelModel[0].shadowing = false
*.gnb2.cellularNic.channelModel[0].shadowing = false
*.gnb.cellularNic.channelModel[0].fading = false
*.gnb2.cellularNic.channelModel[0].fading = false

# ---------------------------------------------------------------------------
# Dynamic UEs: two NR stacks; DSCP 7 is primary, DSCP 8 uses gNB2
# ---------------------------------------------------------------------------
*.car[*].servingNodeId = 0
*.car[*].nrServingNodeId = 1
*.car[*].ipv4.forwarding = true
*.car[*].cellularNic.typename = "NrNicUeDC"
*.car[*].cellularNic.dualConnEnabled = true
*.car[*].cellularNic.hasSdap = true
*.car[*].cellularNic.sdap.useDscpAsQfiFallback = true
*.car[*].cellularNic.sdap2.useDscpAsQfiFallback = true
*.car[*].cellularNic.nrDcMux.secondaryDscps = "8"
*.car[*].cellularNic.rrc.bearerManagement.dcSecondaryDrbIds = "4"
*.car[*].cellularNic.channelModel[0].scenario = "INDOOR_HOTSPOT"
*.car[*].cellularNic.channelModel[0].shadowing = false
*.car[*].cellularNic.channelModel[0].fading = false
*.car[*].cellularNic.nrChannelModel2[0].scenario = "INDOOR_HOTSPOT"
*.car[*].cellularNic.nrChannelModel2[0].shadowing = false
*.car[*].cellularNic.nrChannelModel2[0].fading = false
# Keep the primary stack anchored to gNB (node 1). DRB 2 is provisioned on
# that association; allowing this controller to select gNB2 produces a PDCP
# lookup for (nodeId=2, drbId=2), for which no TX entity exists. The second
# controller remains dynamic so it establishes the independent gNB2 leg used
# exclusively by replica DRB 4.
*.car[*].cellularNic.rrc.nrHandoverController.dynamicCellAssociation = false
*.car[*].cellularNic.rrc.nrHandoverController.enableHandover = false
*.car[*].cellularNic.rrc.nrHandoverController2.dynamicCellAssociation = true
*.car[*].cellularNic.rrc.nrHandoverController2.enableHandover = true
*.car[*].cellularNic.sdap2.nodeRole = "UE"

*.car[*].cellularNic.sdap.drbConfig = [ \
    {drb: 0, qfiList: [0], rlcType: "UM"}, \
    {drb: 2, qfiList: [7], rlcType: "UM"}, \
    {drb: 4, qfiList: [8], rlcType: "UM"}]
*.car[*].cellularNic.sdap2.drbConfig = [ \
    {drb: 0, qfiList: [0], rlcType: "UM"}, \
    {drb: 2, qfiList: [7], rlcType: "UM"}, \
    {drb: 4, qfiList: [8], rlcType: "UM"}]

# ---------------------------------------------------------------------------
# Closed-loop position stream and uplink FRER
# ---------------------------------------------------------------------------
*.car[*].dsTt.frerEnabled = false
*.car[*].dsTt.frerUplinkEnabled = true
*.car[*].dsTt.frerReplicatorUl.frerStreams = "7"
*.car[*].dsTt.frerReplicatorUl.replicaDscp = 8
*.car[*].dsTt.frerReplicatorUl.transportBinding = "drb"
*.car[*].dsTt.frerReplicatorUl.ethernetFramed = true

*.nwTt.frerEnabled = false
*.nwTt.frerInterSession = true
*.nwTt.frerUplinkEnabled = true
*.nwTt.frerRecoveryUl.frerStreams = "7"
*.nwTt.frerRecoveryUl.replicaDscp = 8
*.nwTt.frerRecoveryUl.ethernetFramed = true
*.nwTt.frerRecoveryUl.windowSize = 64
*.nwTt.frerRecoveryUl.windowTimeout = 100ms
*.car[*].positionSource.hasOutgoingStreams = false
*.car[*].positionSource.hasTimeSynchronization = false
*.car[*].positionSource.numApps = 1
*.car[*].positionSource.app[0].typename = "PositionReporterApp"
*.car[*].positionSource.app[0].mobilityModule = "^.^.mobility"
*.car[*].positionSource.app[0].destAddresses = "tsnServer"
*.car[*].positionSource.app[0].destPort = 7000
*.car[*].positionSource.app[0].localPort = -1
*.car[*].positionSource.app[0].messageLength = 20B
*.car[*].positionSource.app[0].sendInterval = 10ms
*.car[*].positionSource.app[0].startTime = 1s + uniform(0ms,9ms)
*.car[*].positionSource.app[0].stopTime = 29.9s
*.car[*].positionSource.app[0].dscp = 7

*.tsnServer.hasOutgoingStreams = false
*.tsnServer.hasTimeSynchronization = false
*.tsnServer.numApps = 1
*.tsnServer.app[0].typename = "UdpSink"
*.tsnServer.app[0].localPort = 7000

*.car[*].positionSource.eth[*].typename = "LayeredEthernetInterface"
*.car[*].positionSource.eth[*].phyLayer.typename = "EthernetStreamingPhyLayer"
*.tsnServer.eth[*].typename = "LayeredEthernetInterface"
*.tsnServer.eth[*].phyLayer.typename = "EthernetStreamingPhyLayer"
*.car[*].positionSource.eth[*].bitrate = 1Gbps
*.tsnServer.eth[*].bitrate = 1Gbps

# DS-TT preserves the original TSN destination MAC while injecting the two
# FRER copies into the UE-facing Ethernet link. Accept those transit frames
# so IPv4 can forward them into the primary and secondary cellular bearers.
*.car[*].eth[0].mac.promiscuous = true

**.arp.typename = "GlobalArp"
*.configurator.assignAddresses = true
*.configurator.addStaticRoutes = true
*.configurator.addDefaultRoutes = false

result-dir = results
output-scalar-file = ${resultdir}/${configname}_run${runnumber}.sca
output-vector-file = ${resultdir}/${configname}_run${runnumber}.vec
**.scalar-recording = true
**.vector-recording = false
*.tsnServer.app[0].packetReceived.vector-recording = true
*.nwTt.frerRecoveryUl.**.vector-recording = true
