[General]
network = nasctime.simulations.demos.tas_comparison.TasComparisonNetwork
sim-time-limit = 90s
# Near saturation the queue's slow modes take ~10 s to settle. A short warm-up
# leaves that transient inside the measurement, which shows up as the first
# half of the run being optimistic relative to the second -- see
# plot_paoi_ccdf.py --check-stationarity.
warmup-period = 10s
simtime-resolution = fs
scheduler-class = "omnetpp::cSequentialScheduler"

**.routingRecorder.enabled = false
**.scalar-recording = true

# ---------------------------------------------------------------------------
# Vector recording
#
# A 90 s run of this network emits several hundred MB of default INET vectors,
# so the catch-all below records nothing and the entries above it opt individual
# vectors back in. The order is what makes that work: within one section
# per-object options are first-match-wins, and `**.vector-recording` matches a
# `<vector>:vector.` prefix too, so a catch-all placed first would swallow
# every enable below it and leave a .vec file of declarations with no samples.
# (An entry in a [Config ...] section outranks [General] regardless of order;
# only same-section entries are ordered against each other.)
#
# Peak-AoI analysis needs the reception delay and the application sequence
# number of every delivered update; analysis/plot_paoi_ccdf.py joins the two on
# the reception event that wrote both.
# ---------------------------------------------------------------------------
*.tsnDeviceB.app[*].endToEndDelay:vector.vector-recording = true
*.tsnDeviceB.app[*].rcvdPkSeqNo:vector.vector-recording = true

# Queue and gate histories, for inspecting shaper behaviour in the IDE.
*.nwTt.ethIf.macLayer.queue.queueLength:vector.vector-recording = true
*.dsTt.tsnEth.macLayer.queue.queueLength:vector.vector-recording = true
*.nwTt.ethIf.macLayer.queue.queue[*].queueLength:vector.vector-recording = true
*.nwTt.ethIf.macLayer.queue.transmissionGate[*].gateState:vector.vector-recording = true
*.dsTt.tsnEth.macLayer.queue.queue[*].queueLength:vector.vector-recording = true
*.dsTt.tsnEth.macLayer.queue.transmissionGate[*].gateState:vector.vector-recording = true

**.vector-recording = false
**.arp.typename = "GlobalArp"
**.binderModule = "binder"

*.configurator.assignAddresses = true
*.configurator.addStaticRoutes = true
*.configurator.addDefaultRoutes = false

# One NR carrier and a fixed, reproducible radio geometry.
*.carrierAggregation.numComponentCarriers = 1
*.carrierAggregation.componentCarrier[0].carrierFrequency = 3.5GHz
*.carrierAggregation.componentCarrier[0].numBands = 25
*.carrierAggregation.componentCarrier[0].numerologyIndex = 1
*.gnb.typename = "gNodeB"
*.gnb.cellularNic.typename = "NrNicEnb"
*.gnb.cellularNic.hasSdap = true
*.ue[0].cellularNic.hasSdap = true
*.gnb.mobility.initialX = 500m
*.gnb.mobility.initialY = 250m
*.ue[0].mobility.initialX = 550m
*.ue[0].mobility.initialY = 250m
*.ue[0].servingNodeId = 0
*.ue[0].nrServingNodeId = 1
*.ue[0].ipv4.forwarding = true

# Keep both QFIs on the same working DRB so this experiment isolates Ethernet
# PCP classification and TAS instead of mixing in a separate-bearer effect.
*.gnb.cellularNic.sdap.drbConfig = [{"drb": 0, "ue": 2049, "qfiList": [0, 6], "rlcType": "UM"}]
*.ue[0].cellularNic.sdap.drbConfig = [{"drb": 0, "qfiList": [0, 6], "rlcType": "UM"}]
*.gnb.cellularNic.mac.drbQosConfig = [ \
    {"drb": 0, "ue": 2049, "gbr": false, "delayBudget": 100, "per": 1e-2, "priority": 1}]
*.gnb.cellularNic.mac.schedulingDisciplineDl = "QOS_PF"
*.gnb.cellularNic.mac.schedulingDisciplineUl = "QOS_PF"

# TT translation settings.
*.nwTt.ueAddress = "ue[0]"
*.nwTt.localAddress = "nwTt"
*.nwTt.translator.encapUdpPort = 30000
*.nwTt.translator.tsnPortMacAddress = "0A:00:00:00:00:01"
*.nwTt.translator.defaultDstMacAddress = "0A:00:00:00:00:10"
*.nwTt.translator.tsnDeviceBAddress = "tsnDeviceB"
*.nwTt.translator.gptpTransportMode = "sideband"
*.nwTt.translator.mappedPcpValues = "0,6"
*.nwTt.ethIf.bitrate = 1Gbps

# TSN AF knows both possible TT shaper locations. It only programs them in Tas.
*.tsnAf.portSpeedBps = 1Gbps
*.tsnAf.numTrafficClasses = 8
*.tsnAf.pcpToQfiMap = "0,1,2,3,4,5,6,7"
*.tsnAf.nwTtModule = "nwTt"
*.tsnAf.dsTtModule = "dsTt"
*.tsnAf.gnbModule = "gnb"
*.tsnAf.tasShaperModules = "nwTt.ethIf.macLayer.queue,dsTt.tsnEth.macLayer.queue"

*.tsnDeviceA.eth[*].bitrate = 1Gbps
*.tsnSwitch.eth[*].bitrate = 1Gbps
*.dsTt.tsnEth.bitrate = 10Mbps
*.tsnDeviceB.eth[*].bitrate = 10Mbps

# NW-TT and DS-TT use streaming Ethernet PHYs, so their directly connected TSN
# peers must also use streaming PHYs. Mixing packet and streaming PHY modes
# causes frames to stop at the link boundary.
*.tsnDeviceA.eth[*].typename = "LayeredEthernetInterface"
*.tsnDeviceA.eth[*].phyLayer.typename = "EthernetStreamingPhyLayer"
*.tsnSwitch.eth[*].typename = "LayeredEthernetInterface"
*.tsnSwitch.eth[*].phyLayer.typename = "EthernetStreamingPhyLayer"
*.tsnDeviceB.eth[*].typename = "LayeredEthernetInterface"
*.tsnDeviceB.eth[*].phyLayer.typename = "EthernetStreamingPhyLayer"

# Two source applications: periodic critical TSN and distributed best effort.
*.tsnDeviceA.numApps = 2
*.tsnDeviceA.app[0].typename = "UdpBasicApp"
*.tsnDeviceA.app[0].packetName = "critical"
*.tsnDeviceA.app[0].destAddresses = "tsnDeviceB"
*.tsnDeviceA.app[0].localPort = 5000
*.tsnDeviceA.app[0].destPort = 5000
*.tsnDeviceA.app[0].messageLength = 200B
*.tsnDeviceA.app[0].sendInterval = 10ms
*.tsnDeviceA.app[0].startTime = 100ms
*.tsnDeviceA.app[0].dscp = 0

*.tsnDeviceA.app[1].typename = "UdpBasicApp"
*.tsnDeviceA.app[1].packetName = "best-effort"
*.tsnDeviceA.app[1].destAddresses = "tsnDeviceB"
*.tsnDeviceA.app[1].localPort = 5001
*.tsnDeviceA.app[1].destPort = 5001
*.tsnDeviceA.app[1].messageLength = intuniform(1200B, 1450B)
# ~9.6 Mbps of 1395-byte frames on the 10 Mbps bottleneck: about 0.98
# utilisation once the critical stream is added. The queue is heavily loaded
# but still stable, so peak AoI has a distribution to measure. An overloaded
# link (the earlier exponential(500us), ~21.6 Mbps) has none: its backlog grows
# for the whole run, so every quantile is a function of sim-time-limit rather
# than a property of the system. Check stationarity after changing this:
#   plot_paoi_ccdf.py ... --check-stationarity
*.tsnDeviceA.app[1].sendInterval = exponential(1.165ms)
*.tsnDeviceA.app[1].startTime = 100ms
*.tsnDeviceA.app[1].dscp = 0

*.tsnDeviceB.numApps = 2
*.tsnDeviceB.app[0].typename = "UdpSink"
*.tsnDeviceB.app[0].localPort = 5000
*.tsnDeviceB.app[1].typename = "UdpSink"
*.tsnDeviceB.app[1].localPort = 5001

# Comparison metrics: per-flow delay/count. Which of these actually reach the
# .vec file is decided by the vector-recording block in [General].
*.tsnDeviceB.app[*].endToEndDelay.result-recording-modes = stats,vector
*.tsnDeviceB.app[*].packetReceived.result-recording-modes = count
*.nwTt.ethIf.macLayer.queue.queueLength.result-recording-modes = vector
*.dsTt.tsnEth.macLayer.queue.queueLength.result-recording-modes = vector
*.nwTt.ethIf.macLayer.queue.queue[*].queueLength.result-recording-modes = vector
*.nwTt.ethIf.macLayer.queue.transmissionGate[*].gateState.result-recording-modes = vector
*.dsTt.tsnEth.macLayer.queue.queue[*].queueLength.result-recording-modes = vector
*.dsTt.tsnEth.macLayer.queue.transmissionGate[*].gateState.result-recording-modes = vector

[Config Baseline]
description = "FIFO TT queues; no PCP separation and no TAS"
result-dir = results/baseline
seed-set = 42
*.tsnAf.cncConfig = xmldoc("cnc_baseline.xml")
*.tsnDeviceA.hasOutgoingStreams = false
*.nwTt.hasEgressTrafficShaping = false
*.dsTt.hasEgressTrafficShaping = false

[Config Tas]
description = "PCP/QFI priority plus CNC-controlled 10 ms TAS cycle at both TTs"
result-dir = results/tas
seed-set = 42
*.tsnAf.cncConfig = xmldoc("cnc_tas.xml")

# Encode critical traffic as PCP 6 and background traffic as PCP 0.
*.tsnDeviceA.hasOutgoingStreams = true
*.tsnDeviceA.bridging.streamIdentifier.identifier.mapping = [ \
    {packetFilter: expr(has(udp) && udp.destPort == 5000), stream: "critical"}, \
    {packetFilter: expr(has(udp) && udp.destPort == 5001), stream: "best-effort"}]
*.tsnDeviceA.bridging.streamCoder.encoder.mapping = [ \
    {stream: "critical", vlan: 100, pcp: 6}, \
    {stream: "best-effort", vlan: 200, pcp: 0}]

# Instantiate INET's Ieee8021qTimeAwareShaper at both TT Ethernet egresses.
*.nwTt.hasEgressTrafficShaping = true
*.nwTt.ethIf.macLayer.queue.numTrafficClasses = 8
*.dsTt.hasEgressTrafficShaping = true
*.dsTt.tsnEth.macLayer.queue.numTrafficClasses = 8
