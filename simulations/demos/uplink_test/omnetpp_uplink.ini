[General]
network = nasctime.simulations.demos.uplink_test.UplinkNetwork
sim-time-limit = 5s
warmup-period = 0.5s
simtime-resolution = fs

scheduler-class = "omnetpp::cSequentialScheduler"

result-dir = results/uplink
**.routingRecorder.enabled = false
**.vector-recording = false
**.scalar-recording = true
**.receivedPacketFromLowerLayer.result-recording-modes = -
**.packetReceived.result-recording-modes = -

# ============================================================================
# TSN AF
# ============================================================================
*.tsnAf.portSpeedBps = 1Gbps
*.tsnAf.numTrafficClasses = 8
*.tsnAf.nwTtModule = "nwTt"
*.tsnAf.dsTtModule = "dsTt[0]"
*.tsnAf.gnbModule = "gnb"

# ============================================================================
# Static BMCA — spanning tree with the standby leg pruned
#
# Grandmaster stays on the listener side (tsnDeviceA), as in the downlink
# scenario: sync flows A -> NW-TT -> (sideband) -> dsTt[0] -> tsnSwitchB ->
# tsnDeviceB. tsnSwitchB.eth1 is the standby leg and appears in neither
# masterPorts nor slavePort, which is what keeps this a tree rather than a
# two-path loop.
#
# Switch port numbering comes from the connection order in UplinkNetwork.ned:
#   eth0 -> dsTt[0], eth1 -> dsTt[1], eth2 -> tsnDeviceB
# ============================================================================
*.staticBmca.grandmasterModule = "tsnDeviceA"
*.staticBmca.transparentClockEnabled = true
*.staticBmca.correctionFieldSupport = true
*.staticBmca.spanningTree = [ \
    {node: "tsnDeviceA", role: "MASTER", masterPorts: ["eth0"], slavePort: ""}, \
    {node: "tsnSwitchB", role: "BRIDGE", masterPorts: ["eth2"], slavePort: "eth0"}, \
    {node: "tsnDeviceB", role: "SLAVE", masterPorts: [], slavePort: "eth0"}]

# ============================================================================
# IP / ARP
# ============================================================================
*.configurator.assignAddresses = true
*.configurator.addStaticRoutes = true
*.configurator.addDefaultRoutes = false
**.arp.typename = "GlobalArp"
*.binderModule = "binder"

# ============================================================================
# 5G RAN
# ============================================================================
*.carrierAggregation.numComponentCarriers = 1
*.carrierAggregation.componentCarrier[0].carrierFrequency = 3.5GHz
*.carrierAggregation.componentCarrier[0].numBands = 25
*.carrierAggregation.componentCarrier[0].numerologyIndex = 1

*.gnb.cellularNic.typename = "NrNicEnb"
*.gnb.cellularNic.phy.channelModel[0].typename = "NrChannelModel"
*.gnb.cellularNic.phy.channelModel[0].scenario = "INDOOR_HOTSPOT"
*.gnb.cellularNic.phy.channelModel[0].shadowing = false
*.gnb.cellularNic.phy.channelModel[0].fading = false
*.gnb.cellularNic.phy.channelModel[0].dynamicLos = false

# ============================================================================
# Node placement
#
# Every mobility module defaults to initFromDisplayString = true
# (MobilityBase.ned), which takes the position from the *display string* and
# silently ignores initialX/initialY. For a module vector that is fatal: the
# NED file can only carry one literal `p=` for all of ue[*] (auto-arrangement
# is rejected by MobilityBase::setInitialPosition), so both UEs ended up on
# the same canvas point *and* at the same radio coordinate.
#
# Turning it off makes the values below the single source of truth; the
# mobility module then pushes them back into the display string, so Qtenv
# draws each node where the ini puts it. Coordinates are chosen to match the
# NED layout: each ue[i] lines up horizontally with its own dsTt[i].
# ============================================================================
*.gnb.mobility.typename = "StationaryMobility"
*.gnb.mobility.initFromDisplayString = false
*.gnb.mobility.initialX = 750m
*.gnb.mobility.initialY = 350m

# ============================================================================
# UEs — active/standby
#
# Both UEs are attached and registered; only the active leg's UE forwards IP.
# With forwarding off on ue[1], the configurator cannot pick it as a next hop
# for tsnDeviceB, so the uplink route is unambiguous without hand-written
# routes. Failing over is the [Config UplinkStandbyLeg] section below.
# ============================================================================
# NOTE: LteUe is not a NetworkLayerNodeBase, so there is no node-level
# `forwarding` to set here — the knob is Ipv4NetworkLayer's own parameter,
# which propagates down via `*.forwarding = this.forwarding`
# (Ipv4NetworkLayer.ned:31).
#
# Order matters: .ini keys are first-match-wins, so the specific active-leg
# entry has to precede the `*.ue[*]` catch-all or it never applies.
*.ue[*].servingNodeId = 0
*.ue[*].nrServingNodeId = 1
*.ue[0].ipv4.forwarding = true
*.ue[*].ipv4.forwarding = false

# See the "Node placement" note above the gNB block for why
# initFromDisplayString has to be off here.
*.ue[*].mobility.typename = "StationaryMobility"
*.ue[*].mobility.initFromDisplayString = false
*.ue[0].mobility.initialX = 950m
*.ue[0].mobility.initialY = 250m
*.ue[1].mobility.initialX = 950m
*.ue[1].mobility.initialY = 450m

*.gnb.cellularNic.hasSdap = true
*.ue[*].cellularNic.hasSdap = true

# ============================================================================
# NW-TT
#
# Uplink-only, so the tsnDeviceB -> UE registration below is not on the data
# path; it only seeds the binder. NwTtTranslator keys tsnToUeMap by the TSN
# device's IP (NwTtTranslator.cc:130), so a single tsnDeviceB address can bind
# to exactly one UE anyway — listing both legs here would silently overwrite,
# not load-balance.
# ============================================================================
*.nwTt.translator.ueAddress = "ue[0]"
*.nwTt.translator.localAddress = "nwTt"
*.nwTt.translator.tsnDeviceBAddress = ""
*.nwTt.translator.tsnDeviceBAddresses = [ \
    {address: "tsnDeviceB", ue: "ue[0]"}]
*.nwTt.translator.gptpTransportMode = "gtpu"
*.nwTt.translator.gptpEncapUdpPort = 30001
*.nwTt.ethIf.bitrate = 1Gbps

# ============================================================================
# DS-TTs
# ============================================================================
*.dsTt[*].translator.gptpEncapUdpPort = 30001

# ============================================================================
# Ethernet
# ============================================================================
*.tsnDeviceA.eth[*].typename = "LayeredEthernetInterface"
*.tsnDeviceA.eth[*].phyLayer.typename = "EthernetStreamingPhyLayer"
*.tsnSwitchB.eth[*].typename = "LayeredEthernetInterface"
*.tsnSwitchB.eth[*].phyLayer.typename = "EthernetStreamingPhyLayer"
*.tsnDeviceB.eth[*].typename = "LayeredEthernetInterface"
*.tsnDeviceB.eth[*].phyLayer.typename = "EthernetStreamingPhyLayer"

*.tsnDevice*.eth[*].bitrate = 1Gbps
*.tsnSwitchB.eth[*].bitrate = 1Gbps

# Pinned so the static forwarding entry below can name them. Left on "auto"
# the addresses are assigned at init and cannot be referenced from a file.
*.ue[0].eth[0].address = "0A-AA-00-00-00-01"
*.ue[1].eth[0].address = "0A-AA-00-00-00-02"

# Nothing on the talker-side segment ever transmits toward tsnDeviceB, so the
# switch never learns the active UE's MAC and floods every uplink frame out
# the standby leg too. This pins the uplink next hop to the active leg's port.
*.tsnSwitchB.macTable.forwardingTableFile = "fdb_leg0.txt"

# ============================================================================
# gPTP
# ============================================================================
*.tsnDeviceA.hasTimeSynchronization = true
*.tsnDeviceA.gptp.gptpNodeType = "MASTER_NODE"
*.tsnDeviceA.gptp.masterPorts = ["eth0"]
*.tsnDeviceA.gptp.slavePort = ""
*.tsnDeviceA.clock.typename = "OscillatorBasedClock"
*.tsnDeviceA.clock.oscillator.nominalTickLength = 10ns

*.tsnSwitchB.hasTimeSynchronization = true
*.tsnSwitchB.gptp.gptpNodeType = "BRIDGE_NODE"
*.tsnSwitchB.gptp.slavePort = "eth0"
*.tsnSwitchB.gptp.masterPorts = ["eth2"]
*.tsnSwitchB.clock.oscillator.nominalTickLength = 10ns

*.tsnDeviceB.hasTimeSynchronization = true
*.tsnDeviceB.gptp.gptpNodeType = "SLAVE_NODE"
*.tsnDeviceB.gptp.slavePort = "eth0"
*.tsnDeviceB.gptp.masterPorts = []
*.tsnDeviceB.gptp.pdelayInterval = 1000s
*.tsnDeviceB.gptp.pdelayInitialOffset = 1000s
*.tsnDeviceB.clock.typename = "SettableClock"
*.tsnDeviceB.clock.oscillator.nominalTickLength = 10ns

# ============================================================================
# SDAP / DRB Configuration
#
# Two UEs -> nodeIds 2049 and 2050. Both legs get DRBs provisioned so a
# failover does not need a RAN reconfiguration.
# ============================================================================
*.gnb.cellularNic.sdap.drbConfig = [ \
    {"drb": 0, "ue": 2049, "qfiList": [0], "rlcType": "UM"}, \
    {"drb": 1, "ue": 2049, "qfiList": [6], "rlcType": "UM"}, \
    {"drb": 0, "ue": 2050, "qfiList": [0], "rlcType": "UM"}, \
    {"drb": 1, "ue": 2050, "qfiList": [6], "rlcType": "UM"}]

*.ue[*].cellularNic.sdap.drbConfig = [ \
    {"drb": 0, "qfiList": [0], "rlcType": "UM"}, \
    {"drb": 1, "qfiList": [6], "rlcType": "UM"}]

# ============================================================================
# Applications — uplink: tsnDeviceB talks, tsnDeviceA listens
#
# NOTE ON TRAFFIC CLASSES: the downlink scenario tags streams with 802.1Q on
# tsnDeviceA and lets NwTtTranslator do the PCP -> DSCP mapping on ingress to
# the 5GS (NwTtTranslator.cc:286-306). In this direction the ingress point is
# the DS-TT, and DsTtTranslator::forwardToUe is a pure transparent relay with
# no VLAN handling at all — a tagged frame would reach the UE's plain
# EthernetEncapsulation as ethertype 0x8100 and be dropped.
#
# So DSCP is set directly at the talker here, which is the value the NW-TT
# would have derived from PCP going the other way. Closing the asymmetry
# properly means porting the strip-and-map logic into DsTtTranslator.
# ============================================================================
*.tsnDeviceB.numApps = 2

*.tsnDeviceB.app[0].typename = "UdpBasicApp"
*.tsnDeviceB.app[0].destAddresses = "tsnDeviceA"
*.tsnDeviceB.app[0].destPort = 5000
*.tsnDeviceB.app[0].localPort = 5000
*.tsnDeviceB.app[0].messageLength = 100B
*.tsnDeviceB.app[0].sendInterval = 1ms
*.tsnDeviceB.app[0].startTime = uniform(0s, 0.01s)
*.tsnDeviceB.app[0].dscp = 6

*.tsnDeviceB.app[1].typename = "UdpBasicApp"
*.tsnDeviceB.app[1].destAddresses = "tsnDeviceA"
*.tsnDeviceB.app[1].destPort = 5001
*.tsnDeviceB.app[1].localPort = 5001
*.tsnDeviceB.app[1].messageLength = 500B
*.tsnDeviceB.app[1].sendInterval = exponential(2ms)
*.tsnDeviceB.app[1].startTime = uniform(0s, 0.01s)
*.tsnDeviceB.app[1].dscp = 0

*.tsnDeviceA.numApps = 2
*.tsnDeviceA.app[0].typename = "UdpSink"
*.tsnDeviceA.app[0].localPort = 5000
*.tsnDeviceA.app[1].typename = "UdpSink"
*.tsnDeviceA.app[1].localPort = 5001

# ============================================================================
# Scenarios
# ============================================================================
[Config UplinkTest]
description = "Uplink from tsnDeviceB through the active DS-TT/UE leg"
*.numUes = 2
*.activeLeg = 0

# ----------------------------------------------------------------------------
# Perfect time sync (mixin)
#
# Drops gPTP entirely and lets every node read simTime() directly, which is
# ideal sync by construction. Use it via multiple inheritance in scenarios
# where synchronization is not the thing under test:
#     extends = UplinkTest, PerfectSync
#
# hasTimeSynchronization = false removes each node's gptp submodule
# (TsnDevice.ned:67) and would also default its clock away
# (TsnDevice.ned:48), but [General] above pins clock.typename explicitly, so
# those assignments have to be undone here too. With no clock submodule,
# ClockUserModuleMixin falls back to simulation time.
#
# The staticBmca spanning tree and the gPTP settings in [General] simply go
# unused; they are left in place so the sections stay readable side by side.
# ----------------------------------------------------------------------------
[Config PerfectSync]
description = "Mixin: no gPTP, every node reads simulation time directly"
*.tsnDeviceA.hasTimeSynchronization = false
*.tsnSwitchB.hasTimeSynchronization = false
*.tsnDeviceB.hasTimeSynchronization = false
*.tsnDeviceA.clock.typename = ""
*.tsnSwitchB.clock.typename = ""
*.tsnDeviceB.clock.typename = ""

# ----------------------------------------------------------------------------
# Runtime reconfiguration
#
# ScenarioManager is instantiated unconditionally in UplinkNetwork.ned but its
# `script` defaults to an empty <script></script>, so it stays inert in every
# config that does not point it at a file.
#
# Caveat for all three configs below: sim-time-limit is 5s and the change
# lands at 2s, so any scalar recorded at finish() averages both regimes --
# 1.5s of baseline after warmup, then 3s of the changed one. Either compare
# separate runs, or record vectors and cut them at t=2s.
# ----------------------------------------------------------------------------
[Config UplinkRuntimeParams]
description = "Talker send rate retuned mid-run: 1ms period -> 100ms at t=2s"
extends = UplinkTest, PerfectSync

# One stream only. [General] configures two talker apps (a class-6 periodic
# one and a best-effort exponential one); here the second is dropped so the
# run has a single flow and the period is the only variable. app[1]'s settings
# in [General] simply stop matching a module and are ignored.
*.tsnDeviceB.numApps = 1
*.tsnDeviceA.numApps = 1

*.scenarioManager.script = xmldoc("runtime_params.xml")

# OMNeT++ 6 refuses a runtime assignment to any parameter not annotated
# @mutable in NED, and INET's UdpBasicApp.ned does not annotate sendInterval
# (it is only `volatile`). Since patching INET is not an option here, relax
# the check for this config; it is exactly the compatibility switch the option
# was added for. Scoped to this section so accidental writes elsewhere still
# fail loudly.
parameter-mutability-check = false

[Config UplinkBadLegEmulated]
description = "Active leg degraded at t=2s by retuning the UE<->DS-TT channel"
extends = UplinkTest, PerfectSync
*.scenarioManager.script = xmldoc("bad_leg.xml")

[Config UplinkBadRadio]
description = "Active leg's UE walks away from the gNB at t=2s"
extends = UplinkTest, PerfectSync

# INDOOR_HOTSPOT is unusable for this: NrChannelModel::computeIndoor throws
# outside 6m < d < 250m (NrChannelModel.cc:156) -- and it throws regardless of
# tolerateMaxDistViolation -- which leaves ~4dB of headroom over the whole
# legal range. URBAN_MICROCELL is valid out to 2000m NLOS, so the UE has room
# to actually lose the link. Both ends need it: uplink SINR is computed by the
# receiver's channel model, i.e. the gNB's, while the UE's own model governs
# the downlink and the CQI feedback.
*.gnb.cellularNic.phy.channelModel[0].scenario = "URBAN_MICROCELL"
*.ue[*].cellularNic.phy.channelModel[0].typename = "NrChannelModel"
*.ue[*].cellularNic.phy.channelModel[0].scenario = "URBAN_MICROCELL"
*.ue[*].cellularNic.phy.channelModel[0].shadowing = false
*.ue[*].cellularNic.phy.channelModel[0].fading = false
*.ue[*].cellularNic.phy.channelModel[0].dynamicLos = false

# ue[0] is the leg that carries the traffic, so it is the one worth degrading;
# degrading ue[1] would change nothing observable while it is the standby.
*.ue[0].mobility.typename = "TurtleMobility"
*.ue[0].mobility.turtleScript = xmldoc("ue0_walkaway.xml", "movements//movement[@id='walkAway']")
*.ue[0].mobility.constraintAreaMinX = 0m
*.ue[0].mobility.constraintAreaMaxX = 2000m
*.ue[0].mobility.constraintAreaMinY = 0m
*.ue[0].mobility.constraintAreaMaxY = 700m
*.ue[0].mobility.constraintAreaMinZ = 0m
*.ue[0].mobility.constraintAreaMaxZ = 0m

# ----------------------------------------------------------------------------
# Mid-run failover, leg 0 to leg 1
#
# Traffic starts on the active leg and moves to the standby one at t=2s by
# retargeting tsnDeviceB's route, which is what actually decides the leg. The
# command comes from the RouteSwitcher module in the network; leg_switch.xml
# has the syntax and the reasoning.
#
# Nothing else changes: the legs keep distinct MAC addresses, the switch keeps
# a static forwarding entry for each of them, and the links stay up throughout.
# So exactly one leg carries traffic at any moment and ue[i].eth[0].mac
# rxPkOk:count reads as a clean before/after split.
# ----------------------------------------------------------------------------
[Config UplinkStandbyLeg]
description = "Traffic starts on leg 0 and fails over to leg 1 at t=2s"
extends = UplinkTest, PerfectSync

# ue[1] has to route once it becomes the next hop. The configurator still picks
# ue[0] for tsnDeviceB's initial route, both legs being otherwise symmetric.
*.ue[*].ipv4.forwarding = true

# One forwarding entry per leg, so frames follow the route rather than being
# flooded out both legs.
*.tsnSwitchB.macTable.forwardingTableFile = "fdb_both.txt"

*.scenarioManager.script = xmldoc("leg_switch.xml")

# ----------------------------------------------------------------------------
# Standby leg, statically configured
#
# Leg 1 carries everything from t=0, with the FDB, the gPTP spanning tree, the
# TSN AF binding and the NW-TT mapping all moved over. Useful as a control run
# for the failover above, and as the check that leg 1 works on its own.
# ----------------------------------------------------------------------------
[Config UplinkStandbyLegOnly]
description = "Same topology brought up entirely on the standby DS-TT/UE leg"
extends = UplinkTest
*.activeLeg = 1
*.ue[0].ipv4.forwarding = false
*.ue[1].ipv4.forwarding = true
*.tsnSwitchB.gptp.slavePort = "eth1"
*.tsnSwitchB.macTable.forwardingTableFile = "fdb_leg1.txt"
*.tsnAf.dsTtModule = "dsTt[1]"
*.nwTt.translator.ueAddress = "ue[1]"
*.nwTt.translator.tsnDeviceBAddresses = [ \
    {address: "tsnDeviceB", ue: "ue[1]"}]
*.staticBmca.spanningTree = [ \
    {node: "tsnDeviceA", role: "MASTER", masterPorts: ["eth0"], slavePort: ""}, \
    {node: "tsnSwitchB", role: "BRIDGE", masterPorts: ["eth2"], slavePort: "eth1"}, \
    {node: "tsnDeviceB", role: "SLAVE", masterPorts: [], slavePort: "eth0"}]
