[General]
network = nasctime.simulations.demos.sumo_nr.SumoNrNetwork
sim-time-limit = 40s
warmup-period = 0s
cmdenv-autoflush = true
debug-on-errors = false
print-undisposed = false
seed-set = 12345

**.routingRecorder.enabled = false
**.sctp.**.scalar-recording = false
**.sctp.**.vector-recording = false

# SUMO/Veins: one vehicle from straight.rou.xml becomes car[0].
*.veinsManager.host = "localhost"
*.veinsManager.port = 9999
*.veinsManager.moduleType = "simu5g.nodes.NrCar"
*.veinsManager.moduleName = "car"
*.veinsManager.launchConfig = xmldoc("straight.launchd.xml")
*.veinsManager.updateInterval = 100ms
*.car[*].mobility.typename = "VeinsInetMobility"

# Save the canonical trajectory that future channel backends will consume.
*.mobilityRecorder.outputFile = "results/mobility.csv"
*.mobilityRecorder.sampleInterval = 100ms
*.mobilityRecorder.startTime = 100ms

# Radio geometry and a deterministic baseline channel.
*.gnb.mobility.typename = "StationaryMobility"
*.gnb.mobility.initFromDisplayString = false
*.gnb.mobility.initialX = 500m
*.gnb.mobility.initialY = 200m
*.gnb.mobility.initialZ = 10m

**.numBands = 25
**.ueTxPower = 26dBm
**.eNodeBTxPower = 46dBm
*.gnb.macCellId = 1
*.gnb.macNodeId = 1
*.car[*].servingNodeId = 0
*.car[*].nrServingNodeId = 1
*.car[*].cellularNic.nrPhy.dynamicCellAssociation = true
*.car[*].cellularNic.channelModel[0].scenario = "URBAN_MICROCELL"
*.gnb.cellularNic.channelModel[0].scenario = "URBAN_MICROCELL"

# One 100 ms UDP flow from the moving UE to the fixed server.
*.server.numApps = 1
*.server.app[0].typename = "UdpSink"
*.server.app[0].localPort = 5000

*.car[*].numApps = 1
*.car[*].app[0].typename = "UdpBasicApp"
*.car[*].app[0].destAddresses = "server"
*.car[*].app[0].destPort = 5000
*.car[*].app[0].messageLength = 256B
*.car[*].app[0].sendInterval = 100ms
*.car[*].app[0].startTime = 1s
*.car[*].app[0].stopTime = 39s

output-scalar-file = "results/SumoNr.sca"
output-vector-file = "results/SumoNr.vec"
**.scalar-recording = true
**.vector-recording = false
