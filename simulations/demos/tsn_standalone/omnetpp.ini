[General]
network = nasctime.simulations.demos.tsn_standalone.TsnStandaloneNetwork
sim-time-limit = 60s
warmup-period = 2s
simtime-resolution = fs
scheduler-class = "omnetpp::cSequentialScheduler"

**.scalar-recording = true

# ---------------------------------------------------------------------------
# Vector recording
#
# Record nothing by default and opt individual vectors back in above the
# catch-all. The order is what makes that work: within one section per-object
# options are first-match-wins, and `**.vector-recording` matches a
# `<vector>:vector.` prefix too, so a catch-all placed first would swallow
# every enable below it and leave a .vec file of declarations with no samples.
#
# Peak-AoI analysis needs the reception delay and the application sequence
# number of every delivered update; analysis/plot_paoi_ccdf.py joins the two on
# the reception event that wrote both.
# ---------------------------------------------------------------------------
*.tsnDeviceC.app[*].endToEndDelay:vector.vector-recording = true
*.tsnDeviceC.app[*].rcvdPkSeqNo:vector.vector-recording = true

# Queue and gate histories at the congested egress port, for checking that the
# shaper classified traffic the way the GCL assumes.
*.tsnSwitch.eth[2].macLayer.queue.queueLength:vector.vector-recording = true
*.tsnSwitch.eth[2].macLayer.queue.queue[*].queueLength:vector.vector-recording = true
*.tsnSwitch.eth[2].macLayer.queue.transmissionGate[*].gateState:vector.vector-recording = true

**.vector-recording = false

**.routingRecorder.enabled = false
**.arp.typename = "GlobalArp"

*.configurator.assignAddresses = true
*.configurator.addStaticRoutes = true
*.configurator.addDefaultRoutes = false

# ---------------------------------------------------------------------------
# TSN AF
#
# The same control-plane module the 5G-TSN scenario uses, reading the same
# gate control list. Here it has no 5GS to talk to -- nwTtModule, dsTtModule
# and gnbModule resolve to nothing, which TsnAf tolerates -- so its only job is
# to program the switch's egress shaper.
# ---------------------------------------------------------------------------
*.tsnAf.portSpeedBps = 1Gbps
*.tsnAf.numTrafficClasses = 8
*.tsnAf.pcpToQfiMap = "0,1,2,3,4,5,6,7"
*.tsnAf.nwTtModule = ""
*.tsnAf.dsTtModule = ""
*.tsnAf.gnbModule = ""
*.tsnAf.tasShaperModules = "tsnSwitch.eth[2].macLayer.queue"

# ---------------------------------------------------------------------------
# Link speeds
#
# Everything is 1 Gbps except the switch's port toward the receiver, which is
# the single congested resource -- the standalone counterpart of the DS-TT's
# 10 Mbps TSN-facing port in the 5G-TSN scenario. Port numbering follows the
# connection order in the NED file: eth0 -> A, eth1 -> B, eth2 -> C. The
# specific entry has to precede the `eth[*]` catch-all: .ini keys are
# first-match-wins.
# ---------------------------------------------------------------------------
*.tsnSwitch.eth[2].bitrate = 10Mbps
*.tsnSwitch.eth[*].bitrate = 1Gbps
*.tsnDeviceA.eth[*].bitrate = 1Gbps
*.tsnDeviceB.eth[*].bitrate = 1Gbps
*.tsnDeviceC.eth[*].bitrate = 10Mbps

# ---------------------------------------------------------------------------
# Traffic — the same two streams as the 5G-TSN scenario, but split across two
# senders so they first meet inside the switch.
# ---------------------------------------------------------------------------
*.tsnDeviceA.numApps = 1
*.tsnDeviceA.app[0].typename = "UdpBasicApp"
*.tsnDeviceA.app[0].packetName = "critical"
*.tsnDeviceA.app[0].destAddresses = "tsnDeviceC"
*.tsnDeviceA.app[0].localPort = 5000
*.tsnDeviceA.app[0].destPort = 5000
*.tsnDeviceA.app[0].messageLength = 200B
*.tsnDeviceA.app[0].sendInterval = 10ms
*.tsnDeviceA.app[0].startTime = 100ms
*.tsnDeviceA.app[0].dscp = 0

*.tsnDeviceB.numApps = 1
*.tsnDeviceB.app[0].typename = "UdpBasicApp"
*.tsnDeviceB.app[0].packetName = "best-effort"
*.tsnDeviceB.app[0].destAddresses = "tsnDeviceC"
*.tsnDeviceB.app[0].localPort = 5001
*.tsnDeviceB.app[0].destPort = 5001
*.tsnDeviceB.app[0].messageLength = intuniform(1200B, 1450B)
# ~9.6 Mbps of 1395-byte frames on the 10 Mbps bottleneck: about 0.98
# utilisation once the critical stream is added. Matches tas_comparison, so the
# two scenarios load their bottleneck identically. The link stays heavily
# loaded but stable, which is what gives peak AoI a distribution to measure --
# an overloaded link has none, only a backlog that grows for the whole run.
*.tsnDeviceB.app[0].sendInterval = exponential(1.165ms)
*.tsnDeviceB.app[0].startTime = 100ms
*.tsnDeviceB.app[0].dscp = 0

# app[0] is the critical sink in both scenarios, so the analysis scripts point
# at the same application index either way.
*.tsnDeviceC.numApps = 2
*.tsnDeviceC.app[0].typename = "UdpSink"
*.tsnDeviceC.app[0].localPort = 5000
*.tsnDeviceC.app[1].typename = "UdpSink"
*.tsnDeviceC.app[1].localPort = 5001

*.tsnDeviceC.app[*].endToEndDelay.result-recording-modes = stats,vector
*.tsnDeviceC.app[*].packetReceived.result-recording-modes = count
*.tsnSwitch.eth[2].macLayer.queue.queueLength.result-recording-modes = vector
*.tsnSwitch.eth[2].macLayer.queue.queue[*].queueLength.result-recording-modes = vector
*.tsnSwitch.eth[2].macLayer.queue.transmissionGate[*].gateState.result-recording-modes = vector

[Config Baseline]
description = "FIFO switch egress; no PCP separation and no TAS"
result-dir = results/baseline
seed-set = 42
*.tsnAf.cncConfig = xmldoc("../tas_comparison/cnc_baseline.xml")
*.tsnDeviceA.hasOutgoingStreams = false
*.tsnDeviceB.hasOutgoingStreams = false
*.tsnSwitch.hasEgressTrafficShaping = false

[Config Tas]
description = "PCP priority plus the CNC-controlled 10 ms TAS cycle at the switch egress"
result-dir = results/tas
seed-set = 42
# The same gate control list the 5G-TSN scenario programs into its TT shapers,
# read from the same file so the two cannot drift apart.
*.tsnAf.cncConfig = xmldoc("../tas_comparison/cnc_tas.xml")

# Encode critical traffic as PCP 6 and background traffic as PCP 0. With eight
# traffic classes, INET's standard 802.1Q mapping puts PCP 0 in traffic class 1
# and PCP 6 in traffic class 6 -- the classes the GCL opens.
*.tsnDeviceA.hasOutgoingStreams = true
*.tsnDeviceA.bridging.streamIdentifier.identifier.mapping = [ \
    {packetFilter: expr(has(udp) && udp.destPort == 5000), stream: "critical"}]
*.tsnDeviceA.bridging.streamCoder.encoder.mapping = [ \
    {stream: "critical", vlan: 100, pcp: 6}]

*.tsnDeviceB.hasOutgoingStreams = true
*.tsnDeviceB.bridging.streamIdentifier.identifier.mapping = [ \
    {packetFilter: expr(has(udp) && udp.destPort == 5001), stream: "best-effort"}]
*.tsnDeviceB.bridging.streamCoder.encoder.mapping = [ \
    {stream: "best-effort", vlan: 200, pcp: 0}]

# The VLAN tag travels end to end here. In the 5G-TSN scenario the DS-TT
# strips it before the receiver, but this network has no translator, so
# tsnDeviceC needs its own 802.1Q layer to decode the tag -- without it the
# receiver's message dispatcher rejects the frame as an unknown protocol.
*.tsnDeviceC.hasIncomingStreams = true

# Instantiate INET's Ieee8021qTimeAwareShaper at the switch's egress ports.
# TsnAf programs the gates of eth[2]; the other ports keep always-open gates.
*.tsnSwitch.hasEgressTrafficShaping = true
*.tsnSwitch.eth[*].macLayer.queue.numTrafficClasses = 8
