#
# frer_dualconn.ini — NR Dual Connectivity FRER validation
#
# Topology:
#   nwTt.pppIf  → upf  → gnb  (primary, scheduler 1)
#   nwTt.pppIf2 → upf2 → gnb2 (replica, scheduler 2)
#   UE with NR-DC: two NR stacks, each connected to one gNB
#
# Prerequisites:
#   1. gNodeBDrb.ned: add ppp2 gate + frerInterSession flag
#   2. NRUeDsTtDrb uses NRNicUeDrbDC NIC with dualConnEnabled=true
#   3. IP configurator: addresses for upf2↔gnb2 subnet
#   4. Binder: UE registered with gnb2 as DC secondary
#

include ../ext_multiendpoint_test/ex_multi_omnetpp.ini

[Config FrerDualConn_N15]
description = "N=15, NR-DC FRER, 10 MHz"
sim-time-limit = 10s
warmup-period = 0.5s

*.gnb.cellularNic.mac.schedulingDisciplineDl = "QOS_PF"
*.gnb.cellularNic.mac.schedulingDisciplineUl = "QOS_PF"
*.gnb2.cellularNic.mac.schedulingDisciplineDl = "QOS_PF"
*.gnb2.cellularNic.mac.schedulingDisciplineUl = "QOS_PF"

repeat = 1
seed-set = 0
**.vector-recording = true
**.scalar-recording = true

include profiles/profiles_N15_frer_asym.ini
*.carrierAggregation.componentCarrier[0].numBands = 212

# --- Enable FRER framework ---
*.nwTt.frerEnabled = true
*.dsTt[*].frerEnabled = true

# --- Enable NR-DC topology ---
*.frerInterSession = true
*.frerDualConn = true
*.nwTt.frerInterSession = true

#*.gnb.cellularNic.processingDelayOut = 1s

# --- Configure FrerReplicator for dual connectivity ---
*.nwTt.frerReplicator.transportBinding = "dualConnectivity"
*.nwTt.frerReplicator.frerStreams = "7"
*.nwTt.frerReplicator.replicaDscp = 8
*.nwTt.frerReplicator.replicaInterface = "pppIf2"

# --- FrerRecovery (unchanged) ---
*.dsTt[*].frerRecovery.frerStreams = "7"
*.dsTt[*].frerRecovery.replicaDscp = 8

# --- UPF2: force tunnel to gnb2 ---
*.upf2.gtp_user.forceTunnelPeer = "gnb2"

# --- UE: enable dual connectivity NIC ---
*.ue[*].cellularNic.typename = "NRNicUeDrbDC"

*.ue[*].cellularNic.nrDlFbGen.phyModule = "^.nrPhy"
*.ue[*].cellularNic.nrDlFbGen2.phyModule = "^.nrPhy2"

*.ue[*].cellularNic.nrPhy.feedbackGeneratorModule = "^.nrDlFbGen"
*.ue[*].cellularNic.nrPhy2.feedbackGeneratorModule = "^.nrDlFbGen2"

# REVIEW: configure gnb2 macNodeId, carrier, and UE DC association
*.gnb2.macNodeId = 2
*.gnb2.macCellId = 2
*.gnb2.masterId=2

# ----- SDAP / DRB config (5 DRBs: BE/MV-HP/CLC/gPTP/FRER-replica) -----
*.gnb2.cellularNic.numDrbs = 5

*.ue[*].cellularNic.nrPhy2.dcMasterId = 2         # gnb2 macNodeId

