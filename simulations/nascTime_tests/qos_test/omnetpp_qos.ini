[General]
network = nasctime.simulations.nascTime_tests.qos_test.qosBridgeTestNetwork
sim-time-limit = 10s
warmup-period = 1s
simtime-resolution = fs

scheduler-class = "omnetpp::cSequentialScheduler"

result-dir = results/qos_test
**.routingRecorder.enabled = false

# Suppress statistics type errors
**.vector-recording = false
**.scalar-recording = true
**.receivedPacketFromLowerLayer.result-recording-modes = -
**.packetReceived.result-recording-modes = -
# Enable scalar recording for UdpSink to count received packets
*.tsnDeviceB.app[*].**.scalar-recording = true

# ============================================================================
# IP / ARP
# ============================================================================
*.configurator.assignAddresses = true
*.configurator.addStaticRoutes = true
*.configurator.addDefaultRoutes = false
**.arp.typename = "GlobalArp"
*.binderModule = "binder"

# ============================================================================
# 5G RAN
# ============================================================================
*.carrierAggregation.numComponentCarriers = 1
*.carrierAggregation.componentCarrier[0].carrierFrequency = 3.5GHz
*.carrierAggregation.componentCarrier[0].numBands = 25
*.carrierAggregation.componentCarrier[0].numerologyIndex = 1

# Use SDAP-aware node types
*.gnb.typename = "gNodeBSdap"
*.ue[0].typename = "NRUeDsTtDrb"  # already has Ethernet; need SDAP too
*.gnb.cellularNic.typename = "NRNicEnbDrb"

# DRB configuration: QFI 6 → DRB 1 (high priority), QFI 0 → DRB 0 (best effort)
# gNB side: specify UE nodeId
*.gnb.cellularNic.sdap.drbConfig = [{drb: 0, ue: 2049, qfiList: [0]}, {drb: 1, ue: 2049, qfiList: [6]}]

# MAC scheduler: priority-based to differentiate DRBs
*.gnb.cellularNic.mac.schedulingDisciplineDl = "MAXCI"
*.gnb.cellularNic.mac.schedulingDisciplineUl = "MAXCI"

#*.gnb.cellularNic.phy.channelModel[0].typename = "NRChannelModel"
#*.gnb.cellularNic.phy.channelModel[0].scenario = "INDOOR_HOTSPOT"
#*.gnb.cellularNic.phy.channelModel[0].shadowing = false
#*.gnb.cellularNic.phy.channelModel[0].fading = false
#*.gnb.cellularNic.phy.channelModel[0].dynamicLos = false
*.gnb.mobility.initialX = 500m
*.gnb.mobility.initialY = 250m

# *.ue[0].nrServingNodeId = 1
*.ue[0].mobility.initialX = 550m
*.ue[0].mobility.initialY = 250m

# needed for DRB
# UE side: no "ue" field needed (NODEID_NONE = "self")
*.ue[0].cellularNic.sdap.drbConfig = [{drb: 0, qfiList: [0]}, {drb: 1, qfiList: [6]}]
*.ue[0].masterId = 0
*.ue[0].nrMacCellId = 1
*.ue[0].nrMasterId = 1
*.gnb.cellularNic.numDrbs = 2
*.ue[*].cellularNic.numDrbs = 2
# ============================================================================
# UE (NRUeDsTt — has built-in Ethernet port for DS-TT)
# ============================================================================
*.ue[0].ipv4.forwarding = true
# DS-TT bridge ports must accept all frames (promiscuous mode)
#*.dsTt.ueEth.mac.promiscuous = true
#*.dsTt.tsnEth.mac.promiscuous = true

# ============================================================================
# NW-TT
# ============================================================================
*.nwTt.ueAddress = "ue[0]"
*.nwTt.localAddress = "nwTt"
*.nwTt.translator.encapUdpPort = 30000
*.nwTt.translator.tsnPortMacAddress = "0A:00:00:00:00:01"
*.nwTt.translator.defaultDstMacAddress = "0A:00:00:00:00:10"
*.nwTt.ethIf.bitrate = 1Gbps
*.nwTt.translator.tsnDeviceBAddress = "tsnDeviceB"
*.nwTt.translator.gptpTransportMode = "gtpu"   # or "sideband"

# Only map PCP 6 and 0, let others pass through with VLAN intact
*.nwTt.translator.mappedPcpValues = "0,6"
# ============================================================================
# TSN AF configuration
# ============================================================================
*.tsnAf.portSpeedBps = 1Gbps
*.tsnAf.numTrafficClasses = 8
*.tsnAf.pcpToQfiMap = "0,1,2,3,4,5,6,7"
*.tsnAf.nwTtModule = "nwTt"
*.tsnAf.dsTtModule = "dsTt"
*.tsnAf.gnbModule = "gnb"

# ============================================================================
# Static BMCA configuration
# ============================================================================
*.staticBmca.grandmasterModule = "tsnDeviceA"
*.staticBmca.grandmasterPriority1 = 246
*.staticBmca.clockClass = 248
*.staticBmca.transparentClockEnabled = true
*.staticBmca.correctionFieldSupport = true
*.staticBmca.spanningTree = [{node: "tsnDeviceA", role: "MASTER", masterPorts: ["eth0"], slavePort: ""}, \
                              {node: "tsnSwitch", role: "BRIDGE", masterPorts: ["eth1"], slavePort: "eth0"}, \
                              {node: "tsnDeviceB", role: "SLAVE", masterPorts: [], slavePort: "eth0"}]

# ============================================================================
# Ethernet bitrates
# ============================================================================
*.tsnDeviceA.eth[*].bitrate = 1Gbps
*.tsnSwitch.eth[*].bitrate = 1Gbps
*.tsnDeviceB.eth[*].bitrate = 1Gbps

# ============================================================================
# Traffic: TSN Device A → TSN Device B (through the full 5G-TSN bridge)
# ============================================================================
# Enable stream identification and 802.1Q encoding on TSN Device A
*.tsnDeviceA.hasOutgoingStreams = true

# Two apps: high priority (PCP=6) and best effort (PCP=0)
*.tsnDeviceA.numApps = 3

# App 0: High priority isochronous traffic
*.tsnDeviceA.app[0].typename = "UdpBasicApp"
*.tsnDeviceA.app[0].destAddresses = "tsnDeviceB"
*.tsnDeviceA.app[0].destPort = 5000
*.tsnDeviceA.app[0].localPort = 5000
*.tsnDeviceA.app[0].messageLength = 100B
*.tsnDeviceA.app[0].sendInterval = 1ms
*.tsnDeviceA.app[0].startTime = uniform(0s, 0.01s)


# App 1: Best effort background traffic
*.tsnDeviceA.app[1].typename = "UdpBasicApp"
*.tsnDeviceA.app[1].destAddresses = "tsnDeviceB"
*.tsnDeviceA.app[1].destPort = 5001
*.tsnDeviceA.app[1].localPort = 5001
*.tsnDeviceA.app[1].messageLength = 500B
*.tsnDeviceA.app[1].sendInterval = exponential(2ms)
*.tsnDeviceA.app[1].startTime = uniform(0s, 0.01s)

*.tsnDeviceA.app[2].typename = "UdpSink"
*.tsnDeviceA.app[2].localPort = 6000

# Stream identification: map apps to streams with different VLAN PCP
*.tsnDeviceA.bridging.streamIdentifier.identifier.mapping = [{packetFilter: "*-0", stream: "high"}, \
                                                              {packetFilter: "*-1", stream: "low"}]
*.tsnDeviceA.bridging.streamCoder.encoder.mapping = [{stream: "high", vlan: 100, pcp: 6}, \
                                                      {stream: "low", vlan: 200, pcp: 0}]

*.tsnDeviceB.numApps = 3
*.tsnDeviceB.app[0].typename = "UdpSink"
*.tsnDeviceB.app[0].localPort = 5000
*.tsnDeviceB.app[1].typename = "UdpSink"
*.tsnDeviceB.app[1].localPort = 5001

*.tsnDeviceB.app[2].typename = "UdpBasicApp"
*.tsnDeviceB.app[2].destAddresses = "tsnDeviceA"
*.tsnDeviceB.app[2].destPort = 6000
*.tsnDeviceB.app[2].localPort = 6000
*.tsnDeviceB.app[2].messageLength = 100B
*.tsnDeviceB.app[2].sendInterval = exponential(2ms)
*.tsnDeviceB.app[2].startTime = 1s
# ============================================================================
# gPTP Time Synchronization
# ============================================================================
# Enable gPTP on TSN devices and switch
*.tsnDeviceA.hasTimeSynchronization = true
*.tsnSwitch.hasTimeSynchronization = true
*.tsnDeviceB.hasTimeSynchronization = true

#*.tsnDeviceB.gptp.pdelayInterval = 1000s
#*.tsnDeviceB.gptp.pdelayInitialOffset = 1000s

# TSN Device A = gPTP grandmaster
*.tsnDeviceA.gptp.gptpNodeType = "MASTER_NODE"
*.tsnDeviceA.gptp.masterPorts = ["eth0"]
*.tsnDeviceA.gptp.slavePort = ""
*.tsnDeviceA.clock.typename = "OscillatorBasedClock"

# TSN Switch = gPTP bridge
*.tsnSwitch.gptp.gptpNodeType = "BRIDGE_NODE"
*.tsnSwitch.gptp.masterPorts = ["eth1"]  # toward NW-TT
*.tsnSwitch.gptp.slavePort = "eth0"  # toward TSN Device A

# TSN Device B = gPTP slave
*.tsnDeviceB.gptp.gptpNodeType = "SLAVE_NODE"
*.tsnDeviceB.gptp.slavePort = "eth0"
*.tsnDeviceB.gptp.masterPorts = []
*.tsnDeviceB.clock.typename = "SettableClock"

# gPTP sideband delay (models 5GS transit time)
*.gptpSideband.sidebandDelay = 2ms

# gPTP requires streaming PHY for precise timestamping
*.tsnDeviceA.eth[*].typename = "LayeredEthernetInterface"
*.tsnDeviceA.eth[*].phyLayer.typename = "EthernetStreamingPhyLayer"
*.tsnSwitch.eth[*].typename = "LayeredEthernetInterface"
*.tsnSwitch.eth[*].phyLayer.typename = "EthernetStreamingPhyLayer"
*.tsnDeviceB.eth[*].typename = "LayeredEthernetInterface"
*.tsnDeviceB.eth[*].phyLayer.typename = "EthernetStreamingPhyLayer"

*.tsnDeviceA.clock.oscillator.nominalTickLength = 10ns
*.tsnDeviceB.clock.oscillator.nominalTickLength = 10ns
*.tsnSwitch.clock.oscillator.nominalTickLength = 10ns

[Config GptpBridgeTest]
description = "Full 5G-TSN bridge with gPTP time synchronization and qos mapping"